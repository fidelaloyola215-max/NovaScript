<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShadowScript</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 18px 10px 40px;
      background:
        radial-gradient(circle at top, #09283a 0%, #040a12 45%, #000 100%);
      color: white;
      font-family: Arial, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 650px;
      margin: auto;
    }

    .header,
    .panel {
      border: 2px solid #00d9ff;
      background: rgba(5, 13, 24, 0.96);
      box-shadow: 0 0 18px rgba(0, 217, 255, 0.15);
    }

    .header {
      padding: 28px 18px;
      margin-bottom: 16px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      color: #ff20d9;
      font-size: 34px;
      letter-spacing: 2px;
      text-shadow:
        0 0 5px #ff20d9,
        0 0 15px #ff20d9,
        0 0 30px #ff20d9;
    }

    .header p {
      margin: 12px 0 0;
      color: #a8edff;
      font-size: 15px;
    }

    .panel {
      padding: 18px;
    }

    .panel-title {
      color: #e9fbff;
      font-size: 23px;
      font-weight: bold;
      margin-bottom: 18px;
    }

    .task {
      display: flex;
      align-items: center;
      gap: 13px;
      width: 100%;
      min-height: 82px;
      margin: 12px 0;
      padding: 14px;
      background: #101d30;
      border: 1px solid #29445d;
      border-left: 4px solid #00d9ff;
      text-decoration: none;
      color: white;
      transition: .2s;
    }

    .task:active {
      transform: scale(.98);
    }

    .task:hover {
      background: #14283e;
      border-color: #00d9ff;
      box-shadow: 0 0 15px rgba(0, 217, 255, .3);
    }

    .icon {
      width: 48px;
      height: 48px;
      min-width: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #08121e;
      border: 1px solid #00d9ff;
      color: #ff20d9;
      font-size: 22px;
      box-shadow: 0 0 10px rgba(0,217,255,.2);
    }

    .task-text {
      flex: 1;
    }

    .task-title {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .task-description {
      color: #91a9b8;
      font-size: 13px;
    }

    .arrow {
      color: #00d9ff;
      font-size: 28px;
    }

    .separator {
      display: flex;
      align-items: center;
      gap: 15px;
      margin: 22px 0;
      color: #7b8d99;
      text-align: center;
      letter-spacing: 4px;
    }

    .separator::before,
    .separator::after {
      content: "";
      height: 1px;
      background: #294052;
      flex: 1;
    }

    .continue {
      display: block;
      padding: 17px;
      margin-top: 18px;
      text-align: center;
      text-decoration: none;
      font-weight: bold;
      color: #001018;
      background: linear-gradient(90deg, #00bde8, #00eaff);
      border: 2px solid #00eaff;
      box-shadow: 0 0 20px rgba(0,220,255,.35);
    }

    .footer {
      margin-top: 22px;
      text-align: center;
      color: #526776;
      font-size: 12px;
    }

    @media (max-width: 480px) {
      .header h1 {
        font-size: 27px;
      }

      .panel {
        padding: 13px;
      }

      .panel-title {
        font-size: 20px;
      }

      .task {
        min-height: 76px;
        padding: 11px;
      }

      .icon {
        width: 42px;
        height: 42px;
        min-width: 42px;
      }

      .task-title {
        font-size: 15px;
      }

      .task-description {
        font-size: 12px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <h1>EL GÜERO😈👹</h1>
      <p>Seleccioná una opción para continuar</p>
    </div>

    <div class="panel">

      <div class="panel-title">
        OPCIONES
      </div>

      <a class="task"
         href="https://www.youtube.com/"
         target="_blank">
        <div class="icon">▶</div>
        <div class="task-text">
          <div class="task-title">VER EL VIDEO</div>
          <div class="task-description">
            Mirá el video en YouTube
          </div>
        </div>
        <div class="arrow">›</div>
      </a>

      <a class="task"
         href="https://www.youtube.com/"
         target="_blank">
        <div class="icon">▶</div>
        <div class="task-text">
          <div class="task-title">SEGUNDO VIDEO</div>
          <div class="task-description">
            Abrir otro video
          </div>
        </div>
        <div class="arrow">›</div>
      </a>

      <a class="task" href="#informacion">
        <div class="icon">★</div>
        <div class="task-text">
          <div class="task-title">INFORMACIÓN</div>
          <div class="task-description">
            Conocé más sobre el proyecto
          </div>
        </div>
        <div class="arrow">›</div>
      </a>

      <a class="task"
         href="https://example.com"
         target="_blank">
        <div class="icon">↗</div>
        <div class="task-text">
          <div class="task-title">SITIO WEB</div>
          <div class="task-description">
            Visitar el sitio web
          </div>
        </div>
        <div class="arrow">›</div>
      </a>

      <a class="continue"
         href="https://www.youtube.com/"
         target="_blank">
        CONTINUAR
      </a>

    </div>

    <div class="separator">OR</div>

    <div class="panel" id="informacion">
      <div class="panel-title">INFORMACIÓN</div>

      <p style="color:#91a9b8; line-height:1.6;">
        Bienvenido a NovaScripts.
      </p>
    </div>

    <div class="footer">
      © 2026 — NovaScripts
    </div>

  </div>

</body>
</html>
